name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze_log.txt 2>&1 || true
          cat analyze_log.txt
          grep -E "(error •|warning •)" analyze_log.txt | while IFS= read -r line; do
            echo "::error title=DartIssue::$line"
          done

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --verbose > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            grep -B 35 -A 5 "Target kernel_snapshot_program failed" build_log.txt | while IFS= read -r line; do
              echo "::error title=KernelFailure::$line"
            done
            grep -B 15 -A 10 "compileFlutterBuildRelease" build_log.txt | while IFS= read -r line; do
              echo "::error title=CompileFlutter::$line"
            done
            grep -B 2 -A 15 "What went wrong:" build_log.txt | while IFS= read -r line; do
              echo "::error title=GradleFailure::$line"
            done
            exit $EXIT_CODE
          fi

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vinayaka-Mitra-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build_log.txt
          if-no-files-found: warn
