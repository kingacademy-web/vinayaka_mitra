name: vinayaka_mitra
description: A complete devotional companion app for Vinayaka Chavithi and Hindu festivals in Telugu & English.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State & Local Storage
  provider: ^6.1.1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  
  # UI & Media
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  
  # File Picking & Document Handling
  file_picker: ^8.0.3
  open_filex: ^4.4.0
  
  # Utilities
  url_launcher: ^6.2.5
  connectivity_plus: ^5.0.2
  intl: ^0.19.0
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/seed/
